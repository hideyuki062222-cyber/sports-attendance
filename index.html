<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2563eb"><title>スポーツクラブ出欠</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><header><h1>🏃 スポーツクラブ出欠</h1><p id="sub">クラブの予定と出欠をかんたん管理</p></header><section id="auth" class="card"><h2>ログイン</h2><input id="email" type="email" placeholder="メールアドレス"><input id="password" type="password" placeholder="パスワード（6文字以上）"><button id="login">ログイン</button><button id="signup" class="secondary">新規登録</button><p id="msg"></p></section><section id="setup" class="card hidden"><h2>最初のクラブを作成</h2><input id="clubName" placeholder="クラブ名"><select id="sport"><option>サッカー</option><option>野球</option><option>バスケットボール</option><option>バレーボール</option><option>フットサル</option><option>テニス</option><option>その他</option></select><button id="createClub">クラブを作成</button></section><section id="app" class="hidden"><div class="card"><div class="row"><div><small>ログイン中</small><h2 id="clubTitle"></h2></div><button id="logout" class="small secondary">ログアウト</button></div></div><nav><button data-tab="calendar" class="active">📅 カレンダー</button><button data-tab="event">➕ 予定</button><button data-tab="members">👥 選手</button></nav><section id="calendar" class="panel card"><div class="row"><button id="prev" class="small">‹</button><h2 id="month"></h2><button id="next" class="small">›</button></div><div class="week"><b>日</b><b>月</b><b>火</b><b>水</b><b>木</b><b>金</b><b>土</b></div><div id="days" class="days"></div><div id="dayEvents"></div><div id="attendanceBox"></div></section><section id="event" class="panel card hidden"><h2>予定を登録</h2><input id="eventDate" type="date"><select id="eventType"><option>練習</option><option>試合</option><option>大会</option><option>遠征</option><option>その他</option></select><input id="eventTitle" placeholder="予定名"><input id="place" placeholder="場所"><div class="two"><label>集合<input id="meet" type="time"></label><label>終了<input id="end" type="time"></label></div><textarea id="notes" placeholder="持ち物・連絡事項"></textarea><button id="saveEvent">予定を保存</button><p id="eventMsg"></p></section><section id="members" class="panel card hidden"><h2>選手管理</h2><div class="two"><input id="playerName" placeholder="選手名"><input id="categoryName" placeholder="カテゴリー例：小学6年"></div><button id="addPlayer">選手を追加</button><div id="playerList"></div><div id="inviteAdmin"><h3>保護者を招待</h3><select id="invitePlayer"><option value="">選手を選択</option></select><button id="makeInvite">招待コードを発行</button><div id="inviteResult"></div></div><div id="guardianArea"><h3>保護者として回答</h3><div class="inviteClaim"><input id="inviteCode" placeholder="招待コード"><button id="claimInvite" class="secondary">招待コードで連携</button><p id="claimMsg"></p></div><select id="replyPlayer"><option value="">選手を選択</option></select><p class="muted">保護者と選手の紐付け後、ここからカレンダー回答できます。</p></div></section></section></main><script src="app.js"></script></body></html>
